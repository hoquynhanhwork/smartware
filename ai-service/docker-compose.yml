services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartware_fastapi
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong ai-service/.env}@postgres:5432/smartware
      DATABASE_URL_RO: postgresql://smartware_ai_ro:${AI_RO_PASSWORD:?Đặt AI_RO_PASSWORD trong ai-service/.env}@postgres:5432/smartware
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - smartware_net

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: smartware_php
    ports:
      - "80:80"
    volumes:
      - C:/xampp/htdocs:/var/www/html
    environment:
      AI_SERVICE_URL: http://smartware_fastapi:8000/api/v1
      AI_API_KEY: ${API_SECRET_KEY:?Đặt API_SECRET_KEY trong ai-service/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong ai-service/.env}
    depends_on:
      - postgres
      - fastapi
    networks:
      - smartware_net

  postgres:
    image: pgvector/pgvector:pg17
    container_name: smartware_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong ai-service/.env}
      POSTGRES_DB: smartware
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_data.sql:/docker-entrypoint-initdb.d/init_data.sql
    networks:
      - smartware_net

networks:
  smartware_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data: